<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DroidGear</title>
    <!-- Keep styles external. An inline <style> here makes Tauri add a CSP
         nonce to style-src, which disables 'unsafe-inline' and blocks the
         <style> elements xterm.js injects at runtime (terminal font breaks). -->
    <link rel="stylesheet" href="/loader.css" />
  </head>

  <body>
    <div id="root"></div>
    <!-- 启动加载画面 -->
    <div id="app-loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">DroidGear</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
