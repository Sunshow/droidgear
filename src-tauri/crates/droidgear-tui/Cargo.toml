[package]
name = "droidgear-tui"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28.1"
dirs = "5"
droidgear-core = { path = "../droidgear-core" }
libc = "0.2"
ratatui = "0.29"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
