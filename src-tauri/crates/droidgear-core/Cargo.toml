[package]
name = "droidgear-core"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
base64 = "0.22"
chrono = "0.4"
dirs = "5"
json_comments = "0.2"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
tempfile = "3"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["time", "rt", "fs", "io-util"] }
log = "0.4"
zstd = "0.14"

[dev-dependencies]
filetime = "0.2"
